services:
  mediawiki:
    image: mediawiki:1.41
    container_name: talod-wiki
    ports:
      - "8080:80"
    volumes:
      # Mount wiki-data for persistence
      - ./wiki-data:/var/www/data
      # Images directory for uploaded files
      - ./wiki-data/images:/var/www/html/images
      # Articles for import
      - ./articles:/import:ro
    restart: unless-stopped
